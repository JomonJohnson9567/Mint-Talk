name: mint_talk
description: "A new Flutter project."
publish_to: 'none' 



version: 1.0.0+1

environment:
  sdk: ^3.10.8
 


dependencies:
  flutter:
    sdk: flutter
 


  cupertino_icons: ^1.0.8
  equatable: ^2.0.8
  flutter_bloc: ^9.1.1
  flutter_screenutil: ^5.9.3
  country_picker: ^2.0.27
  bloc: ^9.2.0
  phone_numbers_parser: ^9.0.19
  google_fonts: ^8.0.1
  get_it: ^9.2.1
  injectable: ^2.7.1+4
  meta: ^1.17.0
  flutter_secure_storage: ^10.0.0
  sms_autofill: ^2.4.1
  dartz: ^0.10.1
  http: ^1.6.0
  dio: ^5.4.3+1
  logger: ^2.7.0
  razorpay_flutter: ^1.3.5
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  loading_animation_widget: ^1.3.0
  socket_io_client: ^3.0.2
  agora_rtc_engine: ^6.3.2
  permission_handler: ^11.3.1
  wakelock_plus: ^1.2.8
  screen_protector: ^1.5.3
  connectivity_plus: ^6.1.4
  crypto: ^3.0.7
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
 



  flutter_lints: ^6.0.0
  build_runner: ^2.11.1
  injectable_generator: ^2.12.0
  flutter_launcher_icons: ^0.14.4
  mocktail: ^1.0.4
  bloc_test: ^10.0.0


flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#F7F7F7"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"
  remove_alpha_ios: true


flutter:



  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
      - assets/images/splash/
      - assets/images/welcome/
      - assets/images/number/
      - assets/images/otpscreen/
      - assets/images/success/     
      - assets/images/profile setup/
      - assets/images/home/
      - assets/host_profile_img/
      - assets/images/target.png
      - assets/wallet.png
      - assets/icon/
